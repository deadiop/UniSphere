<!DOCTYPE html>
<html>
<head>

<title>UniSphere Admin</title>
<link rel="stylesheet" href="styles.css">

</head>

<body>

<h1>Admin Dashboard</h1>

<h2>Add Event</h2>

<input type="text" id="eventName" placeholder="Event Name">
<input type="text" id="eventDate" placeholder="Event Date">

<button onclick="addEvent()">Add Event</button>


<h2>Send Notification</h2>

<input type="text" id="notificationText" placeholder="Notification">

<button onclick="sendNotification()">Send</button>


<h2>Add Faculty</h2>

<input type="text" id="facultyName" placeholder="Faculty Name">
<input type="text" id="facultyDept" placeholder="Department">

<button onclick="addFaculty()">Add Faculty</button>


<script src="admin.js"></script>

</body>
</html>
